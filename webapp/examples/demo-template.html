<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Pozvánka</title>
  <style>
    @page {
      size: A5 landscape;
      margin: 18mm;
    }

    body {
      font-family: DejaVu Serif, serif;
      color: #1f2933;
    }

    .invitation {
      border: 1px solid #a7b0ba;
      height: 100%;
      padding: 18mm;
      text-align: center;
    }

    .label {
      font-size: 11pt;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      font-size: 28pt;
      margin: 18mm 0 10mm;
    }

    .guest {
      font-size: 18pt;
      margin: 8mm 0;
    }
  </style>
</head>
<body>
  <section class="invitation">
    <div class="label">Pozvánka</div>
    <h1>{{ eventDate }}</h1>
    <p class="guest">{{ fullName }} {{ spouse }}</p>
    <p>{{ venue }}</p>
  </section>
</body>
</html>
